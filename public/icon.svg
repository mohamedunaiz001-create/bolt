<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f17" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Stylized Open Book Foundation (Syllabus & Civil Services Knowledge) -->
  <path d="M120 360 C 180 340, 230 350, 256 370 C 282 350, 332 340, 392 360 L 392 230 C 332 210, 282 220, 256 240 C 230 220, 180 210, 120 230 Z"
        fill="#1e293b" stroke="#64748b" stroke-width="8" stroke-linejoin="round" />
  <path d="M256 240 L 256 370" stroke="#64748b" stroke-width="8" stroke-linecap="round" />

  <!-- Bolt Energy Lightning Emblem (Sharp & Bold) -->
  <polygon points="275,80 180,245 250,245 225,410 335,215 265,215"
           fill="url(#goldGrad)"
           stroke="#d97706"
           stroke-width="6"
           stroke-linejoin="miter"
           filter="drop-shadow(0 4px 12px rgba(245, 158, 11, 0.4))" />

  <!-- Inner Spark Accent -->
  <circle cx="340" cy="170" r="14" fill="#60a5fa" />
  <circle cx="170" cy="300" r="10" fill="#38bdf8" />
</svg>
