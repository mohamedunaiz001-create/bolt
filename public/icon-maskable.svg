<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="bgGradMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f17" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background for maskable circle/squircle crops -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe zone contained content (inside 80% boundary) -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Stylized Book -->
    <path d="M120 360 C 180 340, 230 350, 256 370 C 282 350, 332 340, 392 360 L 392 230 C 332 210, 282 220, 256 240 C 230 220, 180 210, 120 230 Z"
          fill="#1e293b" stroke="#64748b" stroke-width="10" stroke-linejoin="round" />
    <path d="M256 240 L 256 370" stroke="#64748b" stroke-width="10" stroke-linecap="round" />

    <!-- Lightning Bolt -->
    <polygon points="275,80 180,245 250,245 225,410 335,215 265,215"
             fill="url(#goldGradMask)"
             stroke="#d97706"
             stroke-width="8"
             stroke-linejoin="miter" />
  </g>
</svg>
