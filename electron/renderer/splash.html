<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BOLT</title>
<style>
  html, body { margin:0; height:100%; background:#0b0f17; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif; color:#e8ecf3; -webkit-app-region: drag; }
  .logo { font-size:26px; font-weight:700; letter-spacing:0.04em; margin-bottom:14px; }
  .sub { font-size:13px; color:#7c8aa5; margin-bottom:26px; }
  .bar { width:180px; height:3px; background:#1c2537; border-radius:2px; overflow:hidden; }
  .bar > div { width:40%; height:100%; background:#4c7dff; border-radius:2px; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
</style>
</head>
<body>
  <div class="logo">BOLT</div>
  <div class="sub">UPSC CSE Preparation Platform</div>
  <div class="bar"><div></div></div>
</body>
</html>
