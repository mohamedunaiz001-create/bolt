<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BOLT — Offline</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0b0f17; color:#e8ecf3; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .box { max-width:380px; text-align:center; padding:24px; }
  h1 { font-size:19px; margin-bottom:10px; }
  p { color:#9aa7bd; font-size:14px; line-height:1.5; }
  button { margin-top:18px; padding:10px 22px; border-radius:10px; border:none;
    background:#4c7dff; color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>You're offline. Your locally available data is preserved. Cloud AI and synchronization will resume when you're back online.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
  <script>
    window.addEventListener("online", () => window.location.reload());
  </script>
</body>
</html>
